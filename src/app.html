<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var family = localStorage.getItem('ari-theme-family') || 'default';
					var dark = family === 'dracula' ? true : localStorage.getItem('ari-theme') !== 'light';
					document.documentElement.dataset.theme = family;
					document.documentElement.classList.toggle('dark', dark);
					if (family === 'custom') {
						var accent = localStorage.getItem('ari-custom-accent');
						if (accent) document.documentElement.style.setProperty('--custom-accent', accent);
					}
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
